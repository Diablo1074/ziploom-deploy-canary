name: ZipLoom Build
# Generated by ZipLoom Deploy (C1 / DECISION #19).
# BUILD ONLY. ZipLoom polls this run, downloads the artifact, and performs the
# deploy itself with the org's own credentials. Do not add a deploy step here.
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: ZipLoom deployment id
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify canary marker
        run: grep -q "canary-v1" index.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ziploom-build-${{ inputs.deployment_id }}
          path: index.html
          retention-days: 1
          if-no-files-found: error
