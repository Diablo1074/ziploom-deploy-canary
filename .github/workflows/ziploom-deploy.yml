# ziploom-build-workflow: v3
# Generated by ZipLoom — do not edit by hand.
# Build-only: builds the app and uploads the artifact. ZipLoom
# downloads the artifact and performs the gated deploy itself.
name: ZipLoom Build
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: ZipLoom deployment id
        required: true
      build_ref:
        description: Exact commit ZipLoom scanned (empty = the dispatched branch)
        required: false
        default: ""
      build_env:
        description: Public build settings (JSON; public-prefixed names only)
        required: false
        default: "{}"
      artifact_mode:
        description: static = build output only; app = runnable app for a server
        required: false
        type: choice
        options: [static, app]
        default: static
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.build_ref }}
          persist-credentials: false
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: inputs.artifact_mode != 'app'
        with:
          name: ziploom-build-${{ inputs.deployment_id }}
          path: |
            .
            !./**/.env*
            !./**/.git/**
            !./**/node_modules/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: inputs.artifact_mode == 'app'
        with:
          name: ziploom-build-${{ inputs.deployment_id }}
          path: |
            .
            !**/node_modules/**
            !**/.git/**
            !**/.env*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
